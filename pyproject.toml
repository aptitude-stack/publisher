[project]
name = "aptitude-publisher"
version = "0.1.16"
description = "Publisher CLI for evaluating and publishing Aptitude skills"
readme = "PYPI.md"
requires-python = ">=3.13.5,<3.14"
keywords = [
    "ai",
    "cli",
    "mcp",
    "publisher",
    "registry",
    "skills",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
    "Topic :: Utilities",
]
dependencies = [
    "llm-guard>=0.3.16,<0.4",
    # Upstream Upskill 0.2.1 is tested against this FastAgent/MCP pair.
    "a2a-sdk==0.3.22",
    "agent-client-protocol>=0.8.1,<0.9.0",
    "fast-agent-mcp==0.6.7",
    "mcp[cli]>=1.26,<1.27",
    "prompt-toolkit>=3.0",
    "pydantic>=2,<3",
    "PyYAML>=6.0",
    "rich>=13.0",
    "toons>=0.5,<1",
    "upskill==0.2.1",
    "zstandard>=0.23,<0.24",
    "numpy>=2.4.6",
]

[project.urls]
Homepage = "https://github.com/aptitude-stack/publisher"
Repository = "https://github.com/aptitude-stack/publisher"
Issues = "https://github.com/aptitude-stack/publisher/issues"
Documentation = "https://github.com/aptitude-stack/publisher/tree/main/docs"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
[project.scripts]
aptitude-publisher = "publisher.app.cli:main"
aptitude-publisher-mcp = "publisher.interfaces.mcp.main:main"

[build-system]
requires = ["setuptools>=81.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["publisher*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
