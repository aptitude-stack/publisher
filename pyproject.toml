[project]
name = "publisher"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "prompt-toolkit>=3.0",
    "PyYAML>=6.0",
    "rich>=13.0",
    "zstandard>=0.23,<0.24",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
evaluators = [
    "garak",
    "upskill",
]

[project.scripts]
aptitude-publisher = "publisher.app.cli:main"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
