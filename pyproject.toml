[project]
name = "aptitude-publisher"
version = "0.1.0"
description = "Publisher CLI for evaluating and publishing Aptitude skills"
readme = "README.md"
requires-python = ">=3.12"
keywords = [
    "ai",
    "cli",
    "publisher",
    "registry",
    "skills",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development",
    "Topic :: Utilities",
]
dependencies = [
    "garak",
    "prompt-toolkit>=3.0",
    "PyYAML>=6.0",
    "rich>=13.0",
    "upskill",
    "zstandard>=0.23,<0.24",
]

[project.urls]
Homepage = "https://github.com/aptitude-stack/publisher"
Repository = "https://github.com/aptitude-stack/publisher"
Issues = "https://github.com/aptitude-stack/publisher/issues"
Documentation = "https://github.com/aptitude-stack/publisher/tree/main/docs"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
[project.scripts]
aptitude-publisher = "publisher.app.cli:main"

[build-system]
requires = ["setuptools>=81.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["publisher*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
